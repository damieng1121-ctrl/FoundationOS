defaultGroups:
  - name: sudo
    must_exist: true
  - name: adm
    must_exist: false
  - name: cdrom
    must_exist: false
  - name: dip
    must_exist: false
  - name: plugdev
    must_exist: false
  - name: audio
    must_exist: false
  - name: video
    must_exist: false
  - name: lpadmin
    must_exist: false
  - name: bluetooth
    must_exist: false
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 4
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "foundation-${cpu}"
  forbidden_names: [ localhost ]
