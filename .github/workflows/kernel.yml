name: Build Stoa kernel

# Rebuilds the Stoa kernel from Ubuntu 24.04's security-maintained hardware-enablement (HWE) kernel source.
# Runs weekly so security fixes reach Stoa, and whenever kernel/ changes.
on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: "Ubuntu source version (e.g. 7.0.0-43.43~24.04.1); empty = latest"
        required: false
      force:
        description: "Rebuild even if a release for this version exists"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths: ["kernel/**", ".github/workflows/kernel.yml"]

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    outputs:
      built: ${{ steps.ver.outputs.skip != 'true' }}
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_PKG: linux-hwe-7.0   # Ubuntu's newest kernel for 24.04 (from 26.04 LTS)
    steps:
      - uses: actions/checkout@v4

      - name: Enable Ubuntu source packages
        run: |
          sudo tee /etc/apt/sources.list.d/stoa-src.sources >/dev/null <<'SRC'
          Types: deb-src
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-security
          Components: main
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SRC
          sudo apt-get update

      - name: Pick kernel version
        id: ver
        run: |
          v="${{ github.event.inputs.ubuntu_version }}"
          [ -n "$v" ] || v="$(apt-cache showsrc "$SRC_PKG" | sed -n 's/^Version: //p' | sort -V | tail -1)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          tag="kernel-$(echo "$v" | tr '~' '-')"   # git tags can't contain '~'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" != "true" ] && [ "${{ github.event_name }}" != "push" ] \
             && gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Stoa kernel for $v already released - nothing to do."
          fi

      - name: Free disk space and install build tools
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves rsync cpio kmod \
            zstd dpkg-dev debhelper python3-pil libdw-dev
          df -h / /mnt

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo mkdir -p /mnt/kwork && sudo chown "$USER" /mnt/kwork
          WORK=/mnt/kwork ./kernel/build-kernel.sh "${{ steps.ver.outputs.version }}"
          ls -lh kernel/out

      - name: Upload packages
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stoa-kernel
          path: kernel/out/*
          retention-days: 30

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        # The ISO build takes the packages from this run's artifact; a release is a convenience for
        # downloading them by hand, so it mustn't fail the build (it needs write access for workflows).
        continue-on-error: true
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" kernel/out/*.deb kernel/out/SHA256SUMS --target "$GITHUB_SHA" \
            --title "Stoa kernel ${{ steps.ver.outputs.version }}" \
            --notes "Stoa kernel built from Ubuntu $SRC_PKG ${{ steps.ver.outputs.version }} with kernel/stoa.config."

  publish-update:
    # Security fixes reach installed PCs: the kernel goes to the same signed update channel as Stoa itself.
    needs: kernel
    if: needs.kernel.outputs.built == 'true'
    runs-on: ubuntu-24.04
    environment: stoa-updates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stoa-kernel
          path: kernel/out
      - name: Sign and publish to the update channel
        env:
          GH_TOKEN: ${{ github.token }}
          STOA_SIGNING_KEY: ${{ secrets.STOA_SIGNING_KEY }}
        run: |
          debs="$(ls kernel/out/linux-image-*stoa*.deb kernel/out/linux-headers-*stoa*.deb)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/stoa-update"
          python3 linux/tools/kernel-manifest.py "$base" $debs > kernel.json
          cat kernel.json
          files="$debs kernel.json"
          if [ -n "$STOA_SIGNING_KEY" ]; then
            sh linux/tools/sign-manifest.sh kernel.json && files="$files kernel.json.sig"
          else
            echo "::warning::STOA_SIGNING_KEY isn't set - publishing an unsigned kernel update"
          fi
          gh release view stoa-update >/dev/null 2>&1 || gh release create stoa-update --prerelease \
            --title "Stoa update channel" --notes "Stoa installs this by itself (Updates app). Nothing to download here."
          gh release upload stoa-update $files --clobber
          keep="$(for d in $debs; do basename "$d"; done)"
          gh release view stoa-update --json assets --jq '.assets[].name' | grep -E '^linux-(image|headers)-' \
            | grep -vxF "$keep" | while read -r old; do gh release delete-asset stoa-update "$old" -y; done
