# Encrypted installs: make sure the start-up image (initramfs) includes disk unlocking, so it asks
# for the password (or uses the TPM, once turned on in Stoa Protect). Nothing happens without encryption.
dontChroot: false
timeout: 120
script:
  - command: "/bin/sh -c 'if grep -qs \"^[^#[:space:]]\" /etc/crypttab; then mkdir -p /etc/cryptsetup-initramfs; echo CRYPTSETUP=y > /etc/cryptsetup-initramfs/conf-hook; fi'"
    timeout: 60
