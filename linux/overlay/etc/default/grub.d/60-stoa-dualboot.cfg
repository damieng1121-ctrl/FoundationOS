# Stoa alongside Windows (or another system): look for it, and show the start-up menu for 5 seconds so
# you can choose. "Restart into Windows" in the power menu picks Windows for the next start-up only.
GRUB_DISABLE_OS_PROBER=false
GRUB_DEFAULT=saved
if command -v os-prober >/dev/null 2>&1 && [ -n "$(os-prober 2>/dev/null)" ]; then
  GRUB_TIMEOUT=5
  GRUB_TIMEOUT_STYLE=menu
fi
