[package]
name = "foundation-toplevels"
version = "0.1.0"
edition = "2021"
description = "Reports open windows to Foundation Shell as JSON lines and accepts activate/close/minimize commands on stdin."

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
