# Stoa desktop tuning.
# zram swap is fast, so use it readily (values as recommended for zram by Fedora/Pop!_OS).
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
# BBR congestion control with the fq queue: faster, steadier downloads and video calls.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
