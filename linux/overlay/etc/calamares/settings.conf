# Foundation OS installer (Calamares)
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
  - id: removelive
    module: packages
    config: packages.conf
  - id: bootpkg
    module: shellprocess
    config: shellprocess_bootpkg.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess_cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - packages@removelive
      - shellprocess@bootpkg
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@cleanup
      - umount
  - show:
      - finished

branding: foundation
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
