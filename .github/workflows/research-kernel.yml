name: Research kernel

on:
  workflow_dispatch:
  push:
    paths: ["research/**", ".github/workflows/research-kernel.yml"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build kernel and disk images
        working-directory: research
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-research-images
          path: research/target/*.img
