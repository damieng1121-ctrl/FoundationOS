overwrite: false
prefer_grub_d: false
keepDistributor: false
defaults:
  GRUB_TIMEOUT: 0
  GRUB_TIMEOUT_STYLE: "hidden"
  GRUB_RECORDFAIL_TIMEOUT: 2
  GRUB_DEFAULT: "0"
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: "console"
  GRUB_DISABLE_RECOVERY: true
  GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash"
