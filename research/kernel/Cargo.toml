[package]
name = "foundation-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "foundation-kernel"
test = false
bench = false

[dependencies]
bootloader_api = "0.11"
x86_64 = "0.15"
pic8259 = "0.11"
pc-keyboard = "0.8"
spin = "0.9"
linked_list_allocator = "0.10"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_24", "unicode-basic-latin"] }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
