name: Build Stoa ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to build (standard, education, business, gaming, or all)"
        default: standard
  workflow_run:
    workflows: ["Build Stoa kernel"]
    types: [completed]
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths: ["linux/**", ".github/workflows/build-iso.yml"]

permissions:
  contents: write
  actions: read   # download the kernel build's packages

jobs:
  update:
    # The in-place update package: install on a running Stoa with `stoa-os-update` or apt.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version number counts commits

      - name: Build update package
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip cmake g++ glslc libvulkan-dev spirv-headers
          ./linux/build-update.sh
          ls -lh linux/out

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: stoa-update
          path: linux/out/stoa-desktop_*.deb
          compression-level: 0

      # Online updates: Stoa PCs check latest.json in the rolling "stoa-update" release and install the package
      # from it (verified by SHA-256). Needs Settings > Actions > General > Workflow permissions: Read and write.
      - name: Publish for automatic updates
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb="$(ls linux/out/stoa-desktop_*.deb | head -1)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/stoa-update"
          python3 linux/tools/update-manifest.py "$deb" "$base" > latest.json
          cat latest.json
          gh release view stoa-update >/dev/null 2>&1 || gh release create stoa-update --prerelease \
            --title "Stoa update channel" --notes "Stoa installs this by itself (Updates app). Nothing to download here."
          gh release upload stoa-update "$deb" latest.json --clobber
          # keep only the newest package
          gh release view stoa-update --json assets --jq '.assets[].name' \
            | grep '^stoa-desktop_' | grep -vx "$(basename "$deb")" \
            | while read -r old; do gh release delete-asset stoa-update "$old" -y; done

  iso:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Version tags build all four editions; other builds the standard one (or what was asked for).
        edition: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || inputs.edition == 'all') && '["standard","education","business","gaming"]' || format('["{0}"]', inputs.edition || 'standard')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools python3-pip \
            cmake g++ glslc libvulkan-dev spirv-headers

      - name: Fetch the latest Stoa kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1) The packages saved by the kernel build that triggered this run, or by the newest kernel build
          #    that produced them (artifacts last 30 days). 2) Otherwise the newest kernel-* release.
          mkdir -p linux/kernel-debs
          runs="${{ github.event.workflow_run.id }}"
          runs="$runs $(gh run list --workflow kernel.yml --status completed --limit 15 --json databaseId --jq '.[].databaseId' || true)"
          for id in $runs; do
            if gh run download "$id" -n stoa-kernel --dir /tmp/stoa-kernel 2>/dev/null \
               && ls /tmp/stoa-kernel/linux-image-*stoa*.deb >/dev/null 2>&1; then
              cp /tmp/stoa-kernel/linux-image-*stoa*.deb /tmp/stoa-kernel/linux-headers-*stoa*.deb linux/kernel-debs/ 2>/dev/null || true
              echo "Using the Stoa kernel built by run $id"; ls -l linux/kernel-debs; exit 0
            fi
            rm -rf /tmp/stoa-kernel
          done
          tag="$(gh release list --limit 50 --json tagName --jq '.[].tagName' | grep '^kernel-' | sort -V | tail -1 || true)"
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern 'linux-image-*.deb' --pattern 'linux-headers-*.deb' --dir linux/kernel-debs
            echo "Using Stoa kernel $tag"; ls -l linux/kernel-debs
          else
            echo "::warning::No Stoa kernel found - this ISO uses Ubuntu's stock kernel"
          fi

      - name: Build Stoa Shell helper (Rust)
        run: cargo build --release --manifest-path linux/shell/toplevels/Cargo.toml

      - name: Build ISO
        run: |
          sudo mkdir -p /mnt/stoa
          sudo WORK=/mnt/stoa/work OUT="$PWD/linux/out" SQUASH_COMP=xz EDITION="${{ matrix.edition }}" ./linux/build-iso.sh
          ls -lh linux/out

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition == 'standard' && 'stoa-os-iso' || format('stoa-{0}-iso', matrix.edition) }}
          path: linux/out/*
          compression-level: 0
          retention-days: 30

      - name: Split ISO for release if over GitHub's 2 GB file limit
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd linux/out
          iso=$(ls *.iso)
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d "$iso" "$iso.part"
            rm "$iso"
            printf 'The ISO is split into parts. Join them, then check the checksum:\n\n  Windows:  copy /b %s.part00 + %s.part01 %s\n  Mac/Linux: cat %s.part* > %s\n' \
              "$iso" "$iso" "$iso" "$iso" "$iso" > HOW-TO-JOIN.txt
          fi
          ls -lh

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linux/out/*
