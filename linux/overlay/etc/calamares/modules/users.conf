defaultGroups:
  - name: sudo
    must_exist: true
  - name: adm
    must_exist: false
  - name: cdrom
    must_exist: false
  - name: dip
    must_exist: false
  - name: plugdev
    must_exist: false
  - name: audio
    must_exist: false
  - name: video
    must_exist: false
  - name: lpadmin
    must_exist: false
  - name: bluetooth
    must_exist: false
  # Wi-Fi without admin prompts, 3D printers / Arduino over USB, graphics compute (Blender, Stoa AI Local)
  - name: netdev
    must_exist: false
  - name: dialout
    must_exist: false
  - name: render
    must_exist: false
  - name: kvm
    must_exist: false
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 4
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "stoa-${cpu}"
  forbidden_names: [ localhost ]
