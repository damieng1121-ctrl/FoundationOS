efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"
userSwapChoices: [ none, file ]
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
# No choice is made for you: on a PC with Windows, "Install alongside" (keep Windows, choose how much space
# Stoa gets) and "Erase disk" are both offered, and nobody should erase Windows by accident.
initialPartitioningChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]
# "Encrypt system" encrypts everything except a small /boot (kernel and start-up files only, no personal
# data). That way the PC asks for the password once - or the TPM unlocks it with no password at all.
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: 1GiB
    noEncrypt: true
  - name: "stoa"
    filesystem: "unknown"
    mountPoint: "/"
    size: 100%
