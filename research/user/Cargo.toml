[package]
name = "stoa-user"
version = "0.1.0"
edition = "2021"

[lib]
name = "stoa"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "hello"
test = false
bench = false

[[bin]]
name = "primes"
test = false
bench = false

[[bin]]
name = "crash"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
