# Stoa user programs: static ring-3 executables placed in the user address range (L4 slot 64,
# 0x2000_0000_0000). The "large" code model (with core rebuilt to match) lets code live that high.
[build]
target = "x86_64-unknown-none"
rustflags = ["-C", "relocation-model=static", "-C", "code-model=large", "-C", "link-arg=--image-base=0x200000000000"]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
