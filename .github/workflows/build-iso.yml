name: Build Foundation OS ISO

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Foundation kernel"]
    types: [completed]
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths: ["linux/**", ".github/workflows/build-iso.yml"]

permissions:
  contents: write

jobs:
  iso:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools python3-pip

      - name: Fetch the latest Foundation kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --limit 50 --json tagName --jq '.[].tagName' | grep '^kernel-' | sort -V | tail -1 || true)"
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern 'linux-image-*.deb' --dir linux/kernel-debs
            echo "Using Foundation kernel $tag"; ls -l linux/kernel-debs
          else
            echo "::warning::No Foundation kernel release yet - this ISO uses Ubuntu's stock kernel"
          fi

      - name: Build Foundation Shell helper (Rust)
        run: cargo build --release --manifest-path linux/shell/toplevels/Cargo.toml

      - name: Build ISO
        run: |
          sudo mkdir -p /mnt/foundation
          sudo WORK=/mnt/foundation/work OUT="$PWD/linux/out" SQUASH_COMP=xz ./linux/build-iso.sh
          ls -lh linux/out

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: foundation-os-iso
          path: linux/out/*
          compression-level: 0
          retention-days: 30

      - name: Split ISO for release if over GitHub's 2 GB file limit
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd linux/out
          iso=$(ls *.iso)
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d "$iso" "$iso.part"
            rm "$iso"
            printf 'The ISO is split into parts. Join them, then check the checksum:\n\n  Windows:  copy /b %s.part00 + %s.part01 %s\n  Mac/Linux: cat %s.part* > %s\n' \
              "$iso" "$iso" "$iso" "$iso" "$iso" > HOW-TO-JOIN.txt
          fi
          ls -lh

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linux/out/*
